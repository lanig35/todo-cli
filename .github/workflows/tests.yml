name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution précédente
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Debian 12, 3.13 = Debian 13 (et version de développement)
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances de test
        run: python -m pip install -r requirements-dev.txt

      # jq : quelques tests vérifient que les sorties JSON sont lisibles par jq (ignorés s'il manque)
      - name: Installer jq
        run: command -v jq >/dev/null || sudo apt-get install -y jq

      - name: Tests
        run: python -m pytest -q
