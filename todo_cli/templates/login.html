{% extends 'base.html' %}
{% from '_macros.html' import csrf with context %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3">Connexion</h1>
    <form method="post" action="{{ url_for('connexion') }}">
      {{ csrf() }}<input type="hidden" name="next" value="{{ suivant }}">
      <label for="jeton" class="form-label">Jeton du serveur</label>
      <input type="password" class="form-control mb-3" id="jeton" name="jeton" autocomplete="current-password" autofocus required>
      <button class="btn btn-primary w-100">Se connecter</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
